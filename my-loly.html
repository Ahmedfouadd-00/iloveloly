<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For my loly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#ffe9f2;
    --dot:#ffd0e2;
    --ribbon:#ff8fb8;
    --ribbon-soft:#ffb7d3;
    --ribbon-deep:#ff5c93;
    --berry:#7a2347;
    --love:#b0245f;
    --btn:#d23674;
    --btn-shadow:#9f2556;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100svh;
    background-color:var(--blush);
    background-image:radial-gradient(var(--dot) 2px, transparent 2.5px);
    background-size:28px 28px;
    font-family:'Fredoka',ui-rounded,'Hiragino Maru Gothic ProN',system-ui,sans-serif;
    color:var(--berry);
    overflow-x:hidden;
  }

  /* ribbons hanging from the top corners */
  .streamer{
    position:fixed; top:0; width:clamp(70px,16vw,120px);
    transform-origin:50% 0; pointer-events:none; z-index:5;
    filter:drop-shadow(0 4px 0 rgba(210,54,116,.18));
  }
  .streamer.left{left:0; animation:sway 6s ease-in-out infinite alternate}
  .streamer.right{right:0; transform:scaleX(-1); animation:swayR 7s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
  @keyframes swayR{from{transform:scaleX(-1) rotate(-2.5deg)}to{transform:scaleX(-1) rotate(2.5deg)}}

  main{
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.6rem; padding:1.5rem 1rem 2.5rem;
  }
  h1{
    margin:0; font-weight:600; font-size:1.25rem; letter-spacing:.02em; color:var(--berry);
  }

  .stage{
    position:relative; width:min(92vw,420px); aspect-ratio:420/460;
  }

  /* ---------- bunny ---------- */
  .bunny{position:absolute; left:36%; top:14%; width:62%; overflow:visible}
  .bunny .eyes-closed{display:none}
  .bunny .cheek{transition:transform .4s, opacity .4s; transform-box:fill-box; transform-origin:center}
  .kiss .bunny .eyes-open{display:none}
  .kiss .bunny .eyes-closed{display:inline}
  .kiss .bunny .cheek{transform:scale(1.35); opacity:.95}
  .bunny-wrap{transform-origin:50% 100%}
  .kiss .bunny-wrap{animation:wiggle .7s .3s ease-in-out}
  @keyframes wiggle{
    0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 50%{transform:rotate(2.5deg)} 75%{transform:rotate(-1.5deg)}
  }

  /* ---------- boy ---------- */
  .boy{
    position:absolute; left:24%; top:35%; width:36%; overflow:visible; z-index:2;
    transform:translateX(-150%); opacity:0;
    transition:transform 1.5s cubic-bezier(.3,.7,.3,1), opacity .35s;
  }
  .walk .boy{transform:none; opacity:1}
  .walk:not(.kiss) .boybody{animation:hop .3s ease-in-out 5}
  @keyframes hop{50%{transform:translateY(-5px)}}
  .head{transform-origin:80px 150px; transition:transform .55s cubic-bezier(.2,.9,.3,1.25)}
  .kiss .head{transform:translate(30px,6px) rotate(9deg)}
  .boy .eyes-closed,.boy .mouth-pucker{display:none}
  .kiss .boy .eyes-open,.kiss .boy .mouth-smile{display:none}
  .kiss .boy .eyes-closed,.kiss .boy .mouth-pucker{display:inline}
  .boy .blush{transition:opacity .4s}
  .kiss .boy .blush{opacity:.9}

  /* the heart that pops where the kiss lands */
  .spot{position:absolute; left:57%; top:56%; width:0; height:0; z-index:4}
  .spotheart{
    position:absolute; left:0; top:0; width:30px; height:30px;
    transform:translate(-50%,-50%) scale(0); opacity:0;
  }
  .done .spotheart{animation:pop .9s ease-out forwards}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(0); opacity:1}
    40%{transform:translate(-50%,-50%) scale(1.5); opacity:1}
    70%{transform:translate(-50%,-50%) scale(1); opacity:1}
    100%{transform:translate(-50%,-80%) scale(1.1); opacity:0}
  }

  /* ---------- message ---------- */
  .message{
    min-height:6.2rem; text-align:center;
    opacity:0; transform:scale(.7) translateY(10px);
    transition:opacity .5s, transform .6s cubic-bezier(.3,1.5,.5,1);
  }
  .done .message{opacity:1; transform:none}
  .message strong{
    display:block; font-family:'Pacifico','Segoe Script',cursive; font-weight:400;
    font-size:clamp(2.6rem,12vw,3.6rem); line-height:1.15; color:var(--love);
  }
  .message span{font-size:1.1rem}

  /* ---------- button ---------- */
  .btn{
    position:relative; font:600 1.15rem/1 'Fredoka',ui-rounded,system-ui,sans-serif;
    color:#fff; background:var(--btn); border:0; border-radius:999px;
    padding:1rem 2rem 1rem 2.7rem; cursor:pointer;
    box-shadow:0 6px 0 var(--btn-shadow);
    transition:transform .12s, box-shadow .12s;
  }
  .btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 8px 0 var(--btn-shadow)}
  .btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 2px 0 var(--btn-shadow)}
  .btn:focus-visible{outline:3px solid var(--berry); outline-offset:5px}
  .btn:disabled{opacity:.75; cursor:default}
  .btn .bowicon{position:absolute; left:-14px; top:-18px; width:46px; height:29px; transform:rotate(-14deg)}

  /* floating hearts */
  #hearts{position:fixed; inset:0; pointer-events:none; z-index:10; overflow:hidden}
  .fh{position:absolute; line-height:1}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .done .spotheart{opacity:1; transform:translate(-50%,-50%) scale(1)}
  }
</style>
</head>
<body>

<!-- shared bow shape -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bow" viewBox="0 0 100 60">
      <path d="M50 30 C30 0 0 2 4 30 C0 58 30 60 50 30Z" fill="var(--bow,#ff8fb8)"/>
      <path d="M50 30 C70 0 100 2 96 30 C100 58 70 60 50 30Z" fill="var(--bow,#ff8fb8)"/>
      <path d="M44 24 C32 12 16 14 14 28" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M56 24 C68 12 84 14 86 28" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="50" cy="30" r="9" fill="var(--bow-knot,#d23674)"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 32 30">
      <path d="M16 29 C4 20 0 14 0 8.5 C0 3.6 3.8 0 8.3 0 C11.6 0 14.4 1.8 16 4.6 C17.6 1.8 20.4 0 23.7 0 C28.2 0 32 3.6 32 8.5 C32 14 28 20 16 29Z"/>
    </symbol>
  </defs>
</svg>

<!-- pink ribbons -->
<svg class="streamer left" viewBox="0 0 120 220" aria-hidden="true">
  <path d="M84 -10 C104 40 62 72 86 126" fill="none" stroke="#ffb7d3" stroke-width="14" stroke-linecap="round"/>
  <path d="M34 -10 C70 50 -6 100 34 176" fill="none" stroke="#ff8fb8" stroke-width="22" stroke-linecap="round"/>
  <path d="M30 -10 C66 50 -10 100 30 176" fill="none" stroke="#ffd0e2" stroke-width="4" stroke-linecap="round"/>
  <use href="#bow" x="4" y="6" width="64" height="38" style="--bow:#ff5c93;--bow-knot:#b0245f"/>
</svg>
<svg class="streamer right" viewBox="0 0 120 220" aria-hidden="true">
  <path d="M84 -10 C104 40 62 72 86 126" fill="none" stroke="#ffb7d3" stroke-width="14" stroke-linecap="round"/>
  <path d="M34 -10 C70 50 -6 100 34 176" fill="none" stroke="#ff8fb8" stroke-width="22" stroke-linecap="round"/>
  <path d="M30 -10 C66 50 -10 100 30 176" fill="none" stroke="#ffd0e2" stroke-width="4" stroke-linecap="round"/>
  <use href="#bow" x="4" y="6" width="64" height="38" style="--bow:#ff5c93;--bow-knot:#b0245f"/>
</svg>

<main id="scene">
  <h1>for my loly</h1>

  <div class="stage">

    <!-- bunny in the background -->
    <svg class="bunny" viewBox="0 0 200 240" aria-hidden="true">
      <g class="bunny-wrap">
        <!-- ears -->
        <path d="M62 96 C38 42 46 4 67 6 C88 8 91 54 87 96Z" fill="#ffb7d3"/>
        <path d="M67 90 C53 52 57 18 68 18 C79 18 81 54 81 90Z" fill="#fff0f6"/>
        <g transform="rotate(14 130 96)">
          <path d="M138 96 C162 42 154 4 133 6 C112 8 109 54 113 96Z" fill="#ffb7d3"/>
          <path d="M133 90 C147 52 143 18 132 18 C121 18 119 54 119 90Z" fill="#fff0f6"/>
        </g>
        <!-- body -->
        <path d="M66 184 C66 174 134 174 134 184 L146 234 H54Z" fill="#ffb7d3"/>
        <path d="M80 182 Q100 196 120 182 L116 176 H84Z" fill="#fffafc"/>
        <ellipse cx="62" cy="206" rx="9" ry="14" fill="#fffafc" transform="rotate(14 62 206)"/>
        <ellipse cx="138" cy="206" rx="9" ry="14" fill="#fffafc" transform="rotate(-14 138 206)"/>
        <!-- hood + face -->
        <ellipse cx="100" cy="138" rx="71" ry="62" fill="#ffb7d3"/>
        <ellipse cx="100" cy="142" rx="56" ry="47" fill="#fffafc"/>
        <use href="#bow" x="124" y="80" width="52" height="31" style="--bow:#ff5c93;--bow-knot:#b0245f"/>
        <!-- eyes -->
        <g class="eyes-open">
          <circle cx="80" cy="140" r="5.5" fill="#3a2230"/><circle cx="78.2" cy="138" r="1.8" fill="#fff"/>
          <circle cx="120" cy="140" r="5.5" fill="#3a2230"/><circle cx="118.2" cy="138" r="1.8" fill="#fff"/>
        </g>
        <g class="eyes-closed" fill="none" stroke="#3a2230" stroke-width="3.5" stroke-linecap="round">
          <path d="M72 142 q8 -9 16 0"/><path d="M112 142 q8 -9 16 0"/>
        </g>
        <ellipse cx="100" cy="152" rx="6" ry="4" fill="#ffd35c"/>
        <path d="M93 160 q7 7 14 0" fill="none" stroke="#3a2230" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse class="cheek" cx="68" cy="156" rx="10" ry="7" fill="#ff8fb8" opacity=".55"/>
        <ellipse class="cheek" cx="132" cy="156" rx="10" ry="7" fill="#ff8fb8" opacity=".55"/>
      </g>
    </svg>

    <!-- the boy (you) -->
    <svg class="boy" viewBox="0 0 160 260" aria-hidden="true">
      <g class="boybody">
        <!-- legs + shoes -->
        <rect x="55" y="200" width="20" height="40" rx="8" fill="#f6c9a6"/>
        <rect x="85" y="200" width="20" height="40" rx="8" fill="#f6c9a6"/>
        <ellipse cx="62" cy="244" rx="16" ry="8" fill="#fffafc" stroke="#ff8fb8" stroke-width="3"/>
        <ellipse cx="98" cy="244" rx="16" ry="8" fill="#fffafc" stroke="#ff8fb8" stroke-width="3"/>
        <!-- shorts -->
        <path d="M48 190 h64 v24 a8 8 0 0 1 -8 8 H56 a8 8 0 0 1 -8 -8z" fill="#4a6fa5"/>
        <!-- arms + shirt -->
        <rect x="30" y="148" width="20" height="46" rx="10" fill="#8ec9f0"/>
        <rect x="110" y="148" width="20" height="46" rx="10" fill="#8ec9f0"/>
        <circle cx="40" cy="198" r="9" fill="#f6c9a6"/>
        <circle cx="120" cy="198" r="9" fill="#f6c9a6"/>
        <rect x="44" y="140" width="72" height="62" rx="22" fill="#8ec9f0"/>
        <path d="M64 142 q16 14 32 0" fill="#f6c9a6"/>
        <!-- little heart on the shirt -->
        <use href="#heart" x="70" y="164" width="20" height="19" fill="#ff5c93"/>
      </g>
      <g class="head">
        <circle cx="36" cy="102" r="8" fill="#f6c9a6"/>
        <circle cx="124" cy="102" r="8" fill="#f6c9a6"/>
        <circle cx="80" cy="98" r="45" fill="#f6c9a6"/>
        <!-- hair -->
        <path d="M34 96 C28 48 132 48 126 96 C118 78 104 70 82 70 C58 70 42 78 34 96Z" fill="#3b2a2f"/>
        <path d="M60 62 C66 46 80 44 88 54" fill="none" stroke="#3b2a2f" stroke-width="9" stroke-linecap="round"/>
        <!-- face -->
        <g class="eyes-open">
          <circle cx="76" cy="102" r="5" fill="#3a2230"/><circle cx="74.4" cy="100.2" r="1.6" fill="#fff"/>
          <circle cx="104" cy="102" r="5" fill="#3a2230"/><circle cx="102.4" cy="100.2" r="1.6" fill="#fff"/>
        </g>
        <g class="eyes-closed" fill="none" stroke="#3a2230" stroke-width="3.2" stroke-linecap="round">
          <path d="M69 104 q7 -8 14 0"/><path d="M97 104 q7 -8 14 0"/>
        </g>
        <ellipse class="blush" cx="64" cy="117" rx="8" ry="5" fill="#ff8fb8" opacity=".55"/>
        <ellipse class="blush" cx="108" cy="117" rx="8" ry="5" fill="#ff8fb8" opacity=".55"/>
        <path class="mouth-smile" d="M82 120 q8 8 16 0" fill="none" stroke="#3a2230" stroke-width="3" stroke-linecap="round"/>
        <path class="mouth-pucker" d="M112 114 q4 -6 7 0 q3 -6 7 0 q0 7 -7 10 q-7 -3 -7 -10z" fill="#ff5c93"/>
      </g>
    </svg>

    <!-- where the kiss lands -->
    <div class="spot" id="spot">
      <svg class="spotheart" viewBox="0 0 32 30" fill="#ff2e75" aria-hidden="true"><use href="#heart"/></svg>
    </div>
  </div>

  <div class="message" aria-live="polite">
    <strong>I love you</strong>
    <span id="who"></span>
  </div>

  <button class="btn" id="go" type="button">
    <svg class="bowicon" viewBox="0 0 100 60" aria-hidden="true"><use href="#bow" style="--bow:#ffb7d3;--bow-knot:#fff"/></svg>
    <span id="label">click here my loly</span>
  </button>
</main>

<div id="hearts" aria-hidden="true"></div>

<script>
  // change these two if you like
  const NAME = 'Ahmed';

  const scene = document.getElementById('scene');
  const btn = document.getElementById('go');
  const label = document.getElementById('label');
  const spot = document.getElementById('spot');
  const hearts = document.getElementById('hearts');
  document.getElementById('who').textContent = '— ' + NAME;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  let busy = false, played = false;

  function burst() {
    if (reduce) return;
    const r = spot.getBoundingClientRect();
    const colors = ['#ff5c93', '#ff8fb8', '#ffb7d3', '#d23674'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.className = 'fh';
      h.textContent = '♥';
      h.style.left = r.left + 'px';
      h.style.top = r.top + 'px';
      h.style.fontSize = (14 + Math.random() * 22) + 'px';
      h.style.color = colors[i % colors.length];
      hearts.appendChild(h);
      const dx = (Math.random() - .5) * 240;
      const dy = -(90 + Math.random() * 200);
      h.animate([
        { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1)`, opacity: 0 }
      ], { duration: 1400 + Math.random() * 900, delay: i * 40, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'both' })
        .onfinish = () => h.remove();
    }
  }

  async function play() {
    if (busy) return;
    busy = true;
    btn.disabled = true;

    if (played) {                      // replay: send him back first
      scene.classList.remove('walk', 'kiss', 'done');
      label.textContent = 'one sec…';
      await wait(1600);
    }

    label.textContent = 'here he comes…';
    scene.classList.add('walk');
    await wait(1700);

    scene.classList.add('kiss');
    await wait(650);

    scene.classList.add('done');
    burst();

    label.textContent = 'once more, my loly';
    btn.disabled = false;
    played = true;
    busy = false;
    btn.focus({ preventScroll: true });
  }

  btn.addEventListener('click', play);
</script>
</body>
</html>
